<!DOCTYPE html>
<html lang="en">
<head>
  <title>Todo List</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #333;
      color: #fff;
    }

    #app {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }

    #todo-title {
      font-size: 24px;
      margin-bottom: 20px;
    }

    button {
      background-color: #555;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.8;
    }

    #todo-bar {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }
    #todo-bar input:hover {
      opacity: 0.8;
    }

    #todo-bar input {
      background-color: #555;
      color: #fff;
      border: none;
      border-radius: 4px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
    }

    .todo-item span {
      flex-grow: 1;
    }

    #completed-title {
      padding: 10px;
    }

    .completed {
      text-decoration: line-through;
      color: gray;
    }
  </style>

  <script src="script.js" defer></script>
</head>

<body>

  <div id="todo-bar">
    <input type="text" id="new-todo" placeholder="Add a new todo">
    <button id="add-todo">Add</button>
    <button id="remove-all-todo">Remove All</button>
  </div>

  <div id="app">
    <h1 id="todo-title">Todo List</h1>
    <button id="changetheme">Change Theme</button>
  </div>

  <div id="todo-list"></div>

  <div id="completed">
    <h2 id="completed-title">Completed Todos</h2>
    <div id="completed-todos"></div>
  </div>

</body>
</html>
